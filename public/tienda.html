<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda Completa | VITRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vitro.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="VITRO, inicio">
      <svg width="30" height="25" viewBox="0 0 48 40" aria-hidden="true"><polygon points="2,4 12,4 19,26 26,4 36,4 24,36 14,36" fill="#fff"/><path d="M40 4 L35.5 16 M45.5 4 L41 16" fill="none" stroke="#FF5B2E" stroke-width="3" stroke-linecap="round"/></svg>
      VITRO
    </a>
    <div style="display:flex;align-items:center;gap:8px">
      <button type="button" class="cartbtn" id="opencart" aria-label="Abrir carrito">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8 H19 L18 21 H6 Z"/><path d="M9 8 V6.5 A3 3 0 0 1 15 6.5 V8"/></svg>
        <b id="cartcount" hidden>0</b>
      </button>
    </div>
  </div>
</header>

<div class="veil" id="veil" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" hidden>
  <header><h2 id="dtitle">Tu pedido</h2><button type="button" class="x" id="closecart" aria-label="Cerrar carrito">&times;</button></header>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot" id="dfoot"></div>
</aside>

<main>
<section class="shop" style="padding-top:48px">
  <div class="wrap">
    <div class="sec-head">
      <div class="eyebrow"><a href="index.html" style="text-decoration:underline;text-underline-offset:4px">Volver al inicio</a></div>
      <h2>Los 6 sets del primer lote</h2>
      <p>Dos modelos en tres colores. Elige talla y agrégalo al carrito; ahí activas el precio estudiante.</p>
    </div>
    <div class="products all" id="products" aria-live="polite"></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div class="legal" style="margin-top:0"><span>&copy; 2026 VITRO &middot; Lote 01</span><span>Pagos: Mercado Pago &middot; transferencia</span></div>
    <div class="wordmark" aria-hidden="true">VITRO</div>
  </div>
</footer>

<script src="catalog.js"></script>
<script>
const CAT = window.VITRO_CATALOG;
const $ = (s, el = document) => el.querySelector(s);
const money = n => "$" + n.toLocaleString("es-MX");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const keyOf = (m, c) => m + "-" + c;
const MODELS = Object.keys(CAT.models), COLORS = Object.keys(CAT.colors);
const stockOf = (m, c, s) => ((CAT.stock[m + "-" + c] || {})[s]) || 0;
const colorStock = (m, c) => CAT.sizes.reduce((t, s) => t + stockOf(m, c, s), 0);
const unitPrice = (c, stu) => (stu ? CAT.studentPrice : CAT.price)[c];

let student = false;
try { student = localStorage.getItem("vitro-student") === "1"; } catch (_) {}
const setStudent = v => { student = v; try { localStorage.setItem("vitro-student", v ? "1" : "0"); } catch (_) {} };

const sel = {};
const PHOTO_POS = { "mujer-verde": "50% 50%" };
const IMAGE_NAMES = {
  "unisex-verde": "loggg.jpg"
};
MODELS.forEach(m => COLORS.forEach(c => {
  sel[keyOf(m, c)] = CAT.sizes.find(z => stockOf(m, c, z) > 0) || CAT.sizes[0];
}));

const FABRIC = {
  navy:  { tela: "78% poliéster · 20% rayón · 2% spandex", peso: "160 g/m²", liq: "Antifluido V-Shield" },
  other: { tela: "65% poliéster · 35% algodón", peso: "150 g/m²", liq: "Sin tratamiento antifluido" }
};
const SAMPLE_ORDER = MODELS.flatMap(m => COLORS.map(c => keyOf(m, c)));

function renderProducts() {
  const root = $("#products");
  root.innerHTML = "";
  MODELS.forEach(m => COLORS.forEach(c => {
    const M = CAT.models[m], col = CAT.colors[c], key = keyOf(m, c), size = sel[key];
    const left = stockOf(m, c, size);
    const soldOut = colorStock(m, c) === 0;
    const img = "img/" + (IMAGE_NAMES[key] || key + ".jpg");
    const card = document.createElement("article");
    card.className = "card"; card.id = "card-" + key;
    const fab = c === "navy" ? FABRIC.navy : FABRIC.other;
    const no = String(SAMPLE_ORDER.indexOf(key) + 1).padStart(2, "0");
    const code = M.name.slice(0, 3).toUpperCase() + "-" + c.slice(0, 3).toUpperCase();
    card.innerHTML = `
      <div class="ph" style="background-image:url(${img});${PHOTO_POS[key] ? "--pos:" + PHOTO_POS[key] : ""}" role="img" aria-label="${esc(M.name)} en ${esc(col.name)}">
        ${col.vshield ? '<span class="chip">V-SHIELD</span>' : ""}
        <span class="lab"><b>Muestra ${no}/${String(SAMPLE_ORDER.length).padStart(2, "0")} · Lote 01</b>${code}</span>
      </div>
      <div class="cinfo">
        <div class="row"><h3><small>Modelo</small>${esc(M.name)}</h3>
          <span class="price">${money(unitPrice(c, false))}<small class="mxn"> MXN</small></span></div>
        <p class="kind">${esc(M.kind)} · ${esc(col.name)}</p>
        <p class="stu">Precio estudiante: <b>${money(unitPrice(c, true))}</b></p>
        <p class="desc">${esc(M.desc)}</p>
        <dl class="spec"><dt>Tela</dt><dd>${fab.tela}</dd><dt>Peso</dt><dd>${fab.peso}</dd><dt>Líquidos</dt><dd>${fab.liq}</dd></dl>
        <div><div class="lbl">Talla: ${esc(size)}${left > 0 && left <= 3 ? ` <span class="few">· quedan ${left}</span>` : ""}</div>
          <div class="sizes" role="group" aria-label="Talla de ${esc(M.name)} ${esc(col.name)}"></div></div>
        <div class="buy"></div>
      </div>`;
    const probe = new Image();
    probe.onerror = () => $(".ph", card).classList.add("nophoto");
    probe.src = img;
    const sizes = $(".sizes", card);
    CAT.sizes.forEach(z => {
      const b = document.createElement("button");
      const out = stockOf(m, c, z) === 0;
      b.type = "button"; b.className = "size"; b.textContent = z;
      if (out) { b.disabled = true; b.title = "Agotada"; b.style.opacity = ".4"; b.style.textDecoration = "line-through"; }
      b.setAttribute("aria-pressed", z === size);
      b.onclick = () => { sel[key] = z; renderProducts(); };
      sizes.appendChild(b);
    });
    const buy = $(".buy", card);
    const add = document.createElement("button");
    add.type = "button"; add.className = "btn";
    add.textContent = soldOut || left === 0 ? "Agotado" : "Agregar al carrito";
    if (soldOut || left === 0) add.disabled = true;
    add.onclick = () => addToCart(m, c, size);
    buy.appendChild(add);
    const n = document.createElement("p");
    n.className = "note";
    n.textContent = "Pago seguro con Mercado Pago: tarjeta, OXXO o transferencia.";
    buy.appendChild(n);
    root.appendChild(card);
  }));
}

let cart = [];
try { cart = JSON.parse(localStorage.getItem("vitro-cart") || "[]"); } catch (_) { cart = []; }
cart = cart.filter(i => CAT.models[i.model] && CAT.colors[i.color] && CAT.sizes.includes(i.size) && stockOf(i.model, i.color, i.size) > 0)
           .map(i => ({ ...i, qty: Math.min(i.qty, stockOf(i.model, i.color, i.size), 10) }));
const saveCart = () => { try { localStorage.setItem("vitro-cart", JSON.stringify(cart)); } catch (_) {} };
const units = () => cart.reduce((t, i) => t + i.qty, 0);
const listTotal = () => cart.reduce((t, i) => t + unitPrice(i.color, false) * i.qty, 0);
const payTotal = () => cart.reduce((t, i) => t + unitPrice(i.color, student) * i.qty, 0);
const shipCost = () => (units() >= CAT.freeShippingFrom ? 0 : CAT.shipping);
const isStudentEmail = email => {
  const d = String(email).toLowerCase().split("@")[1] || "";
  return CAT.studentDomains.some(x => x.startsWith(".") ? d.endsWith(x) : d === x || d.endsWith("." + x));
};

function addToCart(model, color, size) {
  const max = Math.min(10, stockOf(model, color, size));
  const f = cart.find(i => i.model === model && i.color === color && i.size === size);
  if (f) f.qty = Math.min(max, f.qty + 1); else cart.push({ model, color, size, qty: 1 });
  saveCart(); openCart();
}

function openCart() {
  $("#veil").hidden = false; $("#drawer").hidden = false;
  document.body.style.overflow = "hidden";
  renderCart();
  $("#closecart").focus();
}

function closeCart() {
  $("#veil").hidden = true; $("#drawer").hidden = true;
  document.body.style.overflow = "";
}

function updateBadge() {
  const n = units(), b = $("#cartcount");
  b.textContent = n; b.hidden = n === 0;
}

function renderCart() {
  updateBadge();
  const body = $("#dbody"), foot = $("#dfoot");
  body.innerHTML = ""; foot.innerHTML = "";
  if (!cart.length) {
    body.innerHTML = '<p class="empty">Tu carrito está vacío.</p>';
    foot.innerHTML = '<a class="btn" href="#">Volver a la tienda</a>';
    return;
  }
  cart.forEach((item, idx) => {
    const M = CAT.models[item.model], C = CAT.colors[item.color];
    const line = document.createElement("div");
    line.className = "line";
    line.innerHTML = `<div><b>${esc(M.name)} · ${esc(C.name)}</b><small>Talla ${esc(item.size)}</small></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end">
        <div class="qty">
          <button id="qty-minus-${idx}" type="button">−</button>
          <span id="qty-val-${idx}">${item.qty}</span>
          <button id="qty-plus-${idx}" type="button">+</button>
        </div>
        <div style="font-size:14px;margin-top:4px">${money(unitPrice(item.color, false) * item.qty)}</div>
      </div>`;
    body.appendChild(line);
    const max = Math.min(10, stockOf(item.model, item.color, item.size));
    $(`#qty-minus-${idx}`).onclick = () => { item.qty = Math.max(1, item.qty - 1); saveCart(); renderCart(); };
    $(`#qty-plus-${idx}`).onclick = () => { item.qty = Math.min(max, item.qty + 1); saveCart(); renderCart(); };
  });
  foot.innerHTML = `<div class="tot"><span>Subtotal</span><span>${money(listTotal())}</span></div>
    ${student ? `<div class="tot" style="color:#2F7D57"><span>Precio estudiante</span><span>−${money(listTotal() - payTotal())}</span></div>` : ""}
    <div class="tot"><span>Envío</span><span>${shipCost() ? money(shipCost()) : "Gratis"}</span></div>
    <div class="tot big"><span>Total</span><span>${money(payTotal() + shipCost())} MXN</span></div>
    ${shipCost() ? `<p class="note">Envío gratis desde ${CAT.freeShippingFrom} sets.</p>` : ""}
    <button class="btn" style="width:100%" onclick="location.href='index.html#tienda'">Continuar al pago</button>`;
}

$("#opencart").onclick = openCart;
$("#closecart").onclick = closeCart;
$("#veil").onclick = closeCart;
renderProducts(); updateBadge();
</script>
</body>
</html>
