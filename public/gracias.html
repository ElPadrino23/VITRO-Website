<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gracias | VITRO</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FBFAF5;color:#12182B;font-family:'Instrument Sans','Segoe UI',sans-serif;padding:24px}
main{max-width:520px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
h1{font:800 36px Montserrat,Verdana,sans-serif;letter-spacing:-.02em;margin:0}
p{margin:0;color:#53565E;line-height:1.55}
.ref{font-weight:700;color:#12182B;background:#fff;border:1px solid #E4E0D3;border-radius:12px;padding:10px 16px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:14px;background:#12182B;color:#fff;font-weight:600;text-decoration:none}
a:focus-visible{outline:3px solid #12182B;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1 id="t">¡Gracias por tu pedido!</h1>
  <p id="m">Recibimos tu pago. Te escribiremos al correo y al teléfono que dejaste para confirmar el envío.</p>
  <p class="ref" id="r" hidden></p>
  <a class="btn" href="/?pedido=ok">Volver a VITRO</a>
</main>
<script>
const q = new URLSearchParams(location.search);
if (q.get("pedido") === "pendiente") {
  document.getElementById("t").textContent = "Tu pago está pendiente";
  document.getElementById("m").textContent = "Si pagaste en OXXO o por transferencia, lo confirmamos en cuanto Mercado Pago nos avise. Te escribimos al correo que dejaste.";
}
const ref = (q.get("ref") || "").replace(/[^A-Z0-9-]/gi, "");
if (ref) { const r = document.getElementById("r"); r.hidden = false; r.textContent = "Folio de tu pedido: " + ref; }
try { if (q.get("pedido") === "ok") localStorage.removeItem("vitro-cart"); } catch (_) {}
</script>
</body>
</html>
