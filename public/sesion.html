<style>
:root{--bg:#FBFAF5;--ink:#12182B;--muted:#53565E;--navy:#0E1830;--head:'Montserrat','Verdana',sans-serif;--body:'Instrument Sans','Segoe UI',Helvetica,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #E8B84B;outline-offset:3px}
h1{font-family:var(--head);font-size:clamp(32px,5vw,48px);letter-spacing:-.02em;margin:0 0 12px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header{background:var(--navy);padding:20px 0;position:sticky;top:0;z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between}
.logo{font:800 21px var(--head);letter-spacing:.14em;color:#fff}
.back{color:#fff;font-size:14px;font-weight:500}
.back:hover{text-decoration:underline}
main{padding:40px 0 72px}
.intro{color:var(--muted);max-width:560px;margin:0 0 32px}
.masonry{columns:3 300px;column-gap:16px}
.ph-item{display:block;break-inside:avoid;margin-bottom:16px;border-radius:14px;overflow:hidden;background:#E7E3D9}
.ph-item img{display:block;width:100%;height:auto;transition:transform .3s}
.ph-item:hover img{transform:scale(1.02)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;align-items:center;justify-content:center;padding:56px 64px}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;border-radius:22px;width:44px;height:44px;font-size:26px;line-height:1}
#lb button:hover{background:rgba(255,255,255,.25)}
#lb .x{top:12px;right:12px}#lb .pv{left:10px;top:50%;margin-top:-22px}#lb .nx{right:10px;top:50%;margin-top:-22px}
#lb .ct{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-size:14px}
@media (max-width:600px){#lb{padding:56px 8px}}
</style>
</head>

<div id="lb" role="dialog" aria-modal="true" aria-label="Visor de fotos" aria-hidden="true">
  <button class="x" type="button" aria-label="Cerrar">&times;</button>
  <button class="pv" type="button" aria-label="Anterior">&#8249;</button>
  <img src="" alt="">
  <button class="nx" type="button" aria-label="Siguiente">&#8250;</button>
  <div class="ct"></div>
</div>
<script>
const links=[...document.querySelectorAll(".ph-item")],lb=document.getElementById("lb"),im=lb.querySelector("img"),ct=lb.querySelector(".ct");
let i=0,opener=null;
function show(){const a=links[i];im.src=a.href;im.alt=a.querySelector("img").alt;ct.textContent=(i+1)+" de "+links.length}
function open(n,el){i=n;opener=el;show();lb.classList.add("open");lb.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";lb.querySelector(".x").focus()}
function close(){lb.classList.remove("open");lb.setAttribute("aria-hidden","true");document.body.style.overflow="";if(opener)opener.focus()}
function step(d){i=(i+d+links.length)%links.length;show()}
links.forEach((a,n)=>a.addEventListener("click",e=>{e.preventDefault();open(n,a)}));
lb.querySelector(".x").onclick=close;lb.querySelector(".pv").onclick=()=>step(-1);lb.querySelector(".nx").onclick=()=>step(1);
lb.addEventListener("click",e=>{if(e.target===lb)close()});
document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1)});
let sx=0;lb.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)step(d<0?1:-1)});
</script>
